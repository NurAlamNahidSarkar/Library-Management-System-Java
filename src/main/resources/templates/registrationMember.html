<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Registration Page </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <!-- Title section -->
    <div class="title">Registration</div>
    <div class="content">
        <!-- Registration form -->
        <form th:action="@{/regSubmit}" method="post" th:object="${member}">
            <div class="user-details">
                <!-- Input for Full Name -->
                <div class="input-box">
                    <span class="details">Full Name</span>
                    <input th:field="*{name}" type="text" placeholder="Enter your name" required>
                </div>

                <!-- Input for Email -->
                <div class="input-box">
                    <span class="details">Email</span>
                    <input th:field="*{email}" type="text" placeholder="Enter your email" required>
                </div>
                <!-- Input for Phone Number -->
                <div class="input-box">
                    <span class="details">Phone Number</span>
                    <input th:field="*{phone_number}" type="text" placeholder="Enter your number" required>
                </div>
                <!-- Input for Address -->
                <div class="input-box">
                    <span class="details">Address</span>
                    <input th:field="*{address}" type="text" placeholder="Enter your address" required>
                </div>
                <!-- Input for Password -->
                <div class="input-box">
                    <span class="details">Password</span>
                    <input th:field="*{password}" type="text" placeholder="Enter your password" required>
                </div>
                <!-- Input for Confirm Password -->
                <div class="input-box">
                    <span class="details">Confirm Password</span>
                    <input th:field="*{password}" type="text" placeholder="Confirm your password" required>
                </div>
            </div>
            <!-- Submit button -->
            <div class="button">
                <input type="submit" value="Register">
            </div>

            <div class="text" style="text-align: center;">
                <span>
                    <h4>Already have an account?
                        <a th:href="@{/}" style="color: blue; text-decoration: underline;">Log in</a>
                    </h4>
                </span>
            </div>



        </form>
    </div>
</div>
</body>
</html>
